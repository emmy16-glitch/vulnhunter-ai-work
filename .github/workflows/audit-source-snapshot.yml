name: Apply audited repository patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/final-wiring-and-ui-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v6
        with:
          ref: agent/final-wiring-and-ui-audit
          fetch-depth: 0

      - name: Build verified audit commit
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee /tmp/vulnhunter-apply.log) 2>&1
          set -euo pipefail

          cat .github/vh-audit-patch-[0-9][0-9].b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/vulnhunter-audit.patch

          git apply --check \
            --exclude=.github/workflows/audit-source-snapshot.yml \
            /tmp/vulnhunter-audit.patch
          git apply \
            --exclude=.github/workflows/audit-source-snapshot.yml \
            /tmp/vulnhunter-audit.patch
          rm -f .github/vh-audit-patch-*.b64
          rm -f .github/workflows/audit-source-snapshot.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Consolidate navigation and remove stale web wiring"
          git rev-parse HEAD | tee /tmp/vulnhunter-final-sha.txt
          git push --force origin HEAD:refs/heads/agent/audit-result-staging

      - name: Upload applicator diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vulnhunter-audit-applicator
          path: |
            /tmp/vulnhunter-apply.log
            /tmp/vulnhunter-final-sha.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Fail when the audited commit was not published
        if: steps.apply.outcome == 'failure'
        run: exit 1
