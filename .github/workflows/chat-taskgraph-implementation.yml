          workflow_path = root / 'vulnhunter' / 'web' / 'assessment_workflow.py'
          workflow = workflow_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:100]!r}')
              return text.replace(old, new, 1)

          workflow = replace_once(
              workflow,
              'from pydantic import BaseModel, ConfigDict\n\nfrom vulnhunter.agent.models',
              'from pydantic import BaseModel, ConfigDict\n\n'
              'from vulnhunter.assessment_graph import AssessmentGraphError, AssessmentGraphService\n'
              'from vulnhunter.agent.models',
          )
          workflow = replace_once(
              workflow,
              '@dataclass(frozen=True)\nclass AssessmentCreationResult:\n    task: AgentTask\n    approval_request: ApprovalRequest | None\n',
              '@dataclass(frozen=True)\nclass AssessmentCreationResult:\n'
              '    task: AgentTask\n'
              '    approval_request: ApprovalRequest | None\n'
              '    graph_id: str | None = None\n',
