name: Temporary final report idempotency fix

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-final-report-idempotency-fix.yml
      - scripts/patch_final_report_idempotency.py

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'impl/governed-final-report-generation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: impl/governed-final-report-generation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: python scripts/patch_final_report_idempotency.py
      - run: python -m ruff format vulnhunter/assessment_graph/remediation.py tests/unit/test_final_remediation_report_graph.py
      - run: python -m ruff check vulnhunter/assessment_graph/remediation.py tests/unit/test_final_remediation_report_graph.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vulnhunter/assessment_graph/remediation.py tests/unit/test_final_remediation_report_graph.py
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Make passed retest replay idempotent"
          git push origin HEAD:impl/governed-final-report-generation
