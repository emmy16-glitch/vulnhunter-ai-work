name: Temporary mobile final repair

on:
  push:
    branches:
      - feature/unified-chat-mobile-hunt

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-final-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/unified-chat-mobile-hunt
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore contracts and format expanded mobile code
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("vulnhunter/mobile/static_toolchain.py")
          source = path.read_text(encoding="utf-8")
          old = '"title": ("APK contains native libraries requiring native-code scrutiny"),'
          new = '"title": "APK contains native libraries",'
          if old not in source:
              raise SystemExit("canonical native-library observation source was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          python -m pip install 'ruff>=0.9,<1'
          python -m ruff check --fix \
            scripts/configure_mobsf.py \
            scripts/install_mobile_release_tools.py \
            scripts/mobile_androguard_adapter.py \
            scripts/mobile_frida_inventory.py \
            scripts/mobile_yara_adapter.py \
            scripts/prepare_mobile_static_worker.py \
            scripts/register_mobile_runtime.py \
            vulnhunter/hunt \
            vulnhunter/mobile/mobsf.py \
            vulnhunter/mobile/runtime.py \
            vulnhunter/mobile/static_progress.py \
            vulnhunter/mobile/static_service.py \
            vulnhunter/mobile/static_spool.py \
            vulnhunter/mobile/static_toolchain.py \
            vulnhunter/mobile/static_worker.py \
            vulnhunter/web/mobile_conversation.py \
            vulnhunter/web/mobile_conversation_state.py \
            vulnhunter/web/mobile_execution.py \
            vulnhunter/web/mobile_infrastructure.py \
            tests/unit/test_mobile_chat_hunt.py \
            tests/unit/test_mobile_hunt_runtime.py
          python -m ruff format \
            scripts/configure_mobsf.py \
            scripts/install_mobile_release_tools.py \
            scripts/mobile_androguard_adapter.py \
            scripts/mobile_frida_inventory.py \
            scripts/mobile_yara_adapter.py \
            scripts/prepare_mobile_static_worker.py \
            scripts/register_mobile_runtime.py \
            vulnhunter/hunt \
            vulnhunter/mobile/mobsf.py \
            vulnhunter/mobile/runtime.py \
            vulnhunter/mobile/static_progress.py \
            vulnhunter/mobile/static_service.py \
            vulnhunter/mobile/static_spool.py \
            vulnhunter/mobile/static_toolchain.py \
            vulnhunter/mobile/static_worker.py \
            vulnhunter/web/mobile_conversation.py \
            vulnhunter/web/mobile_conversation_state.py \
            vulnhunter/web/mobile_execution.py \
            vulnhunter/web/mobile_infrastructure.py \
            tests/unit/test_mobile_chat_hunt.py \
            tests/unit/test_mobile_hunt_runtime.py
      - name: Commit deterministic repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            scripts/configure_mobsf.py \
            scripts/install_mobile_release_tools.py \
            scripts/mobile_androguard_adapter.py \
            scripts/mobile_frida_inventory.py \
            scripts/mobile_yara_adapter.py \
            scripts/prepare_mobile_static_worker.py \
            scripts/register_mobile_runtime.py \
            vulnhunter/hunt \
            vulnhunter/mobile/mobsf.py \
            vulnhunter/mobile/runtime.py \
            vulnhunter/mobile/static_progress.py \
            vulnhunter/mobile/static_service.py \
            vulnhunter/mobile/static_spool.py \
            vulnhunter/mobile/static_toolchain.py \
            vulnhunter/mobile/static_worker.py \
            vulnhunter/web/mobile_conversation.py \
            vulnhunter/web/mobile_conversation_state.py \
            vulnhunter/web/mobile_execution.py \
            vulnhunter/web/mobile_infrastructure.py \
            tests/unit/test_mobile_chat_hunt.py \
            tests/unit/test_mobile_hunt_runtime.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Repair mobile contracts and formatting [mobile-final-repair]'
          git push origin HEAD:feature/unified-chat-mobile-hunt
