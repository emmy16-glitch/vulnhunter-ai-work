name: Temporary Source Hunt Finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/groq-source-hunt-loop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.9,<1'
      - name: Apply final source-hunt integrity and lint patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('vulnhunter/source_hunt/service.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '        report_id = f"source-report-{hashlib.sha256((snapshot.snapshot_sha256 + approval.approval_sha256).encode()).hexdigest()[:24]}"\n': '''        report_seed = (\n            snapshot.snapshot_sha256 + approval.approval_sha256\n        ).encode()\n        report_digest = hashlib.sha256(report_seed).hexdigest()\n        report_id = f"source-report-{report_digest[:24]}"\n''',
              '                safe_error="No supported attacker-accessible Python entry point reached a dangerous sink.",\n': '''                safe_error=(\n                    "No supported attacker-accessible Python entry point reached "\n                    "a dangerous sink."\n                ),\n''',
              '                                reason=f"Capability filter rejected the candidate: {capability.reason}",\n': '''                                reason=(\n                                    "Capability filter rejected the candidate: "\n                                    f"{capability.reason}"\n                                ),\n''',
              '            "task": "Map the supplied deterministic attack surfaces. Do not invent files or execution.",\n': '''            "task": (\n                "Map the supplied deterministic attack surfaces. Do not invent "\n                "files or execution."\n            ),\n''',
              '                "Act as an attacker-first source-code hunter. Determine whether attacker-controlled "\n': '''                "Act as an attacker-first source-code hunter. Determine whether "\n                "attacker-controlled "\n''',
              '                "Independently try to disprove this vulnerability. Reject unsupported reachability, "\n                "sanitization assumptions, framework mistakes, existing controls, unrealistic attacker "\n                "capabilities, and source-to-sink gaps. Prefer REJECTED or ABSTAINED when uncertain."\n': '''                "Independently try to disprove this vulnerability. Reject "\n                "unsupported reachability, sanitization assumptions, framework "\n                "mistakes, existing controls, unrealistic attacker capabilities, "\n                "and source-to-sink gaps. Prefer REJECTED or ABSTAINED when uncertain."\n''',
              '                "Determine the concrete attacker capability. Mark meaningful=false when the issue is "\n                "only suspicious syntax, requires impossible access, or produces no security boundary break."\n': '''                "Determine the concrete attacker capability. Mark meaningful=false "\n                "when the issue is only suspicious syntax, requires impossible access, "\n                "or produces no security boundary break."\n''',
              '                "Propose the smallest reviewable remediation, a RED security regression test, a GREEN "\n': '''                "Propose the smallest reviewable remediation, a RED security "\n                "regression test, a GREEN "\n''',
              '            "Return exactly one provider response object. Set output_kind to CANDIDATE_ANALYSIS and "\n            "set content to a JSON-encoded object matching required_schema when supplied. Do not include "\n': '''            "Return exactly one provider response object. Set output_kind to "\n            "CANDIDATE_ANALYSIS and set content to a JSON-encoded object matching "\n            "required_schema when supplied. Do not include "\n''',
              '            lines = (root / reference.path).read_text(encoding="utf-8").splitlines()\n': '''            source_path = root / reference.path\n            raw = source_path.read_bytes()\n            if hashlib.sha256(raw).hexdigest() != reference.source_sha256:\n                raise SourceHuntError(\n                    "repository changed before source excerpts were prepared"\n                )\n            try:\n                lines = raw.decode("utf-8").splitlines()\n            except UnicodeDecodeError as exc:\n                raise SourceHuntError(\n                    "source excerpt could not be decoded safely"\n                ) from exc\n''',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          ruff format vulnhunter/source_hunt/service.py
          ruff check vulnhunter/source_hunt/service.py
      - name: Commit final patch
        shell: bash
        run: |
          git config user.name 'vulnhunter-quality-bot'
          git config user.email 'vulnhunter-quality-bot@users.noreply.github.com'
          git add vulnhunter/source_hunt/service.py
          git commit -m 'Harden and finish Groq source hunt service'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
