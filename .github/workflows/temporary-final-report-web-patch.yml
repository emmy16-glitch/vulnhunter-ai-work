name: Temporary final report web patch

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-final-report-web-patch.yml
      - scripts/patch_final_report_web.py

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'impl/governed-final-report-generation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: impl/governed-final-report-generation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: python scripts/patch_final_report_web.py
      - run: python -m ruff format vulnhunter/reports/final_remediation.py vulnhunter/web/final_report_service.py vulnhunter/web/remediation_final_report_views.py vulnhunter/web/remediation_final_report_conversation_views.py vulnhunter/web/remediation_conversation_state.py vulnhunter/web/remediation_views.py vulnhunter/web/urls.py tests/unit/test_final_remediation_report_web.py tests/unit/test_final_remediation_report_signing_key.py
      - run: python -m ruff check --fix vulnhunter/reports/final_remediation.py vulnhunter/web/final_report_service.py vulnhunter/web/remediation_final_report_views.py vulnhunter/web/remediation_final_report_conversation_views.py vulnhunter/web/remediation_conversation_state.py vulnhunter/web/remediation_views.py vulnhunter/web/urls.py tests/unit/test_final_remediation_report_web.py tests/unit/test_final_remediation_report_signing_key.py
      - run: node --check vulnhunter/web/static/web/conversation-runtime-compat.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example docs/intelligence/VULNHUNTER_MASTER_ARCHITECTURE.md vulnhunter/reports/final_remediation.py vulnhunter/web/final_report_service.py vulnhunter/web/remediation_final_report_views.py vulnhunter/web/remediation_final_report_conversation_views.py vulnhunter/web/remediation_conversation_state.py vulnhunter/web/remediation_views.py vulnhunter/web/urls.py vulnhunter/web/static/web/conversation-runtime-compat.js vulnhunter/web/templates/web/remediation_detail.html vulnhunter/web/templates/web/remediation_final_report.html tests/unit/test_final_remediation_report_web.py tests/unit/test_final_remediation_report_signing_key.py
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Wire governed final report workspace"
          git push origin HEAD:impl/governed-final-report-generation
