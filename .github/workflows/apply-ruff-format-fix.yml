name: Apply Ruff formatting fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/final-wiring-and-ui-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v6
        with:
          ref: agent/final-wiring-and-ui-audit
          fetch-depth: 0

      - name: Apply verified formatting
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/ruff-format-fix.patch
          git apply .github/ruff-format-fix.patch
          rm .github/ruff-format-fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply canonical formatting to audit fixes"
          git push origin HEAD:agent/final-wiring-and-ui-audit
