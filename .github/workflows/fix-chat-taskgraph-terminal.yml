name: Repair terminal sibling taskgraph

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.head_ref == 'impl/chat-taskgraph-slice' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: impl/chat-taskgraph-slice
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact implementation repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if new in text and old not in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected source state in {path}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "vulnhunter/assessment_graph/service.py",
              "        for stage, action, action_class, tool_id, operation, approval_required, status in stage_specs:\n",
              "        for (\n"
              "            stage,\n"
              "            action,\n"
              "            action_class,\n"
              "            tool_id,\n"
              "            operation,\n"
              "            approval_required,\n"
              "            status,\n"
              "        ) in stage_specs:\n",
          )
          replace_once(
              "vulnhunter/assessment_graph/service.py",
              "                raise AssessmentGraphError(\"approval projection conflicts with terminal graph state\")\n",
              "                raise AssessmentGraphError(\n"
              "                    \"approval projection conflicts with terminal graph state\"\n"
              "                )\n",
          )
          replace_once(
              "vulnhunter/web/assessment_workflow.py",
              "                run_id,\n                approved=approved,\n",
              "                task.task_id,\n                approved=approved,\n",
          )
          replace_once(
              "vulnhunter/web/assessment_workflow.py",
              "                        run_id,\n                        reason=\"Worker queue activation failed closed.\",\n",
              "                        task.task_id,\n                        reason=\"Worker queue activation failed closed.\",\n",
          )
          replace_once(
              "vulnhunter/taskgraph/models.py",
              "        for field_name in immutable:\n"
              "            if getattr(self, field_name) != getattr(previous, field_name):\n"
              "                raise ValueError(f\"task node field is immutable: {field_name}\")\n"
              "        if self.status not in _ALLOWED_TRANSITIONS[previous.status]:\n",
              "        for field_name in immutable:\n"
              "            if getattr(self, field_name) != getattr(previous, field_name):\n"
              "                raise ValueError(f\"task node field is immutable: {field_name}\")\n"
              "        if self == previous:\n"
              "            return\n"
              "        if self.status not in _ALLOWED_TRANSITIONS[previous.status]:\n",
          )

          tests = Path("tests/unit/test_taskgraph.py")
          text = tests.read_text(encoding="utf-8")
          if "test_task_graph_allows_unchanged_terminal_siblings" not in text:
              text += '''


def test_task_graph_allows_unchanged_terminal_siblings(tmp_path):
    graph = TaskGraph(
        graph_id="graph-terminal-sibling",
        campaign_id="campaign-01",
        run_id="run-01",
        nodes=(
            GraphNode(
                node_id="authorize",
                role_id="scope-guardian",
                skill_id="exact-scope-validation",
                action_manifest_sha256="a" * 64,
                status=NodeStatus.COMPLETED,
            ),
            GraphNode(
                node_id="execute",
                role_id="scanner-evidence-specialist",
                skill_id="governed-security-tool-operation",
                action_manifest_sha256="b" * 64,
                dependencies=("authorize",),
            ),
        ),
    )
    store = TaskGraphStore(tmp_path)
    store.save(graph)

    updated = store.update_status(
        "graph-terminal-sibling",
        node_id="execute",
        status=NodeStatus.RUNNING,
        expected_revision=0,
    )

    assert updated.nodes[0].status == NodeStatus.COMPLETED
    assert updated.nodes[1].status == NodeStatus.RUNNING
'''
              tests.write_text(text, encoding="utf-8")
          PY
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Format and verify
        env:
          VULNHUNTER_WEB_SECRET_KEY: chat-taskgraph-check-secret
        run: |
          python -m ruff check --fix \
            vulnhunter/assessment_graph \
            vulnhunter/taskgraph/models.py \
            vulnhunter/web/assessment_workflow.py \
            vulnhunter/web/conversational_views.py \
            tests/unit/test_assessment_graph.py \
            tests/unit/test_assessment_workflow.py \
            tests/unit/test_taskgraph.py
          python -m ruff format \
            vulnhunter/assessment_graph \
            vulnhunter/taskgraph/models.py \
            vulnhunter/web/assessment_workflow.py \
            vulnhunter/web/conversational_views.py \
            tests/unit/test_assessment_graph.py \
            tests/unit/test_assessment_workflow.py \
            tests/unit/test_taskgraph.py
          python -m ruff check \
            vulnhunter/assessment_graph \
            vulnhunter/taskgraph/models.py \
            vulnhunter/web/assessment_workflow.py \
            vulnhunter/web/conversational_views.py \
            tests/unit/test_assessment_graph.py \
            tests/unit/test_assessment_workflow.py \
            tests/unit/test_taskgraph.py
          python -m ruff format --check \
            vulnhunter/assessment_graph \
            vulnhunter/taskgraph/models.py \
            vulnhunter/web/assessment_workflow.py \
            vulnhunter/web/conversational_views.py \
            tests/unit/test_assessment_graph.py \
            tests/unit/test_assessment_workflow.py \
            tests/unit/test_taskgraph.py
          python -m compileall -q vulnhunter/assessment_graph vulnhunter/taskgraph vulnhunter/web
          python -m pytest -q \
            tests/unit/test_assessment_graph.py \
            tests/unit/test_assessment_workflow.py \
            tests/unit/test_taskgraph.py \
            tests/unit/test_conversational_workspace.py \
            tests/unit/test_conversation_experience.py
          git diff --check
      - name: Commit only verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            vulnhunter/assessment_graph \
            vulnhunter/taskgraph/models.py \
            vulnhunter/web/assessment_workflow.py \
            vulnhunter/web/conversational_views.py \
            tests/unit/test_assessment_graph.py \
            tests/unit/test_assessment_workflow.py \
            tests/unit/test_taskgraph.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Repair chat taskgraph implementation [verified-terminal-fix]'
          git push origin HEAD:impl/chat-taskgraph-slice
