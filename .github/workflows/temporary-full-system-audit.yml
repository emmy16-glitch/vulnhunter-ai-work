name: Temporary full-system 70x7 audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-workspace-isolation:
    if: github.head_ref == 'agent/full-system-audit'
    name: Apply verified workspace isolation repair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: agent/full-system-audit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply, test and commit only while the repair trigger exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f temporary-workspace-run-isolation-repair.trigger ]]; then
            echo 'Workspace isolation repair is already applied.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"Expected marker missing from {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          old = (
              "    if target:\n"
              "        return _latest_visible_run(actor, target=target)\n"
              "    return None\n"
          )
          new = (
              "    stored_target = state.get(\"target\")\n"
              "    if (\n"
              "        target\n"
              "        and isinstance(stored_target, str)\n"
              "        and stored_target\n"
              "        and canonical_target(stored_target) == canonical_target(target)\n"
              "    ):\n"
              "        return _latest_visible_run(actor, target=target)\n"
              "    return None\n"
          )
          replace_once("vulnhunter/web/conversational_views.py", old, new)

          old = (
              "    if not getattr(request.user, \"is_authenticated\", False):\n"
              "        return\n"
              "    raw_state = request.session.get(_SESSION_STATE, {})\n"
          )
          new = (
              "    if not getattr(request.user, \"is_authenticated\", False):\n"
              "        return\n"
              "    # Durable workspaces own their run binding. Global recovery is retained only\n"
              "    # for legacy requests that are not attached to a ConversationThread.\n"
              "    if getattr(request, \"vulnhunter_thread\", None) is not None:\n"
              "        return\n"
              "    raw_state = request.session.get(_SESSION_STATE, {})\n"
          )
          replace_once("vulnhunter/web/middleware.py", old, new)

          old = (
              "    assert conversational_views._authoritative_run({}, object()) is None\n"
              "    assert (\n"
              "        conversational_views._authoritative_run(\n"
              "            {},\n"
              "            object(),\n"
              "            target=\"http://10.0.1.51:8010/\",\n"
              "        )\n"
              "        is latest\n"
              "    )\n"
          )
          new = (
              "    assert conversational_views._authoritative_run({}, object()) is None\n"
              "    assert (\n"
              "        conversational_views._authoritative_run(\n"
              "            {},\n"
              "            object(),\n"
              "            target=\"http://10.0.1.51:8010/\",\n"
              "        )\n"
              "        is None\n"
              "    )\n"
              "    assert (\n"
              "        conversational_views._authoritative_run(\n"
              "            {\"target\": \"http://10.0.1.51:8010/\"},\n"
              "            object(),\n"
              "            target=\"http://10.0.1.51:8010/\",\n"
              "        )\n"
              "        is latest\n"
              "    )\n"
          )
          replace_once("tests/unit/test_stale_conversation_state.py", old, new)

          path = Path("tests/unit/test_product_consolidation_repairs.py")
          text = path.read_text(encoding="utf-8")
          test = (
              "\n\n"
              "def test_durable_empty_workspace_does_not_restore_another_live_run(monkeypatch):\n"
              "    user = SimpleNamespace(is_authenticated=True)\n"
              "    request = SimpleNamespace(\n"
              "        method=\"GET\",\n"
              "        path=\"/\",\n"
              "        user=user,\n"
              "        session=_Session(),\n"
              "        vulnhunter_thread=SimpleNamespace(thread_id=\"new-thread\"),\n"
              "    )\n\n"
              "    def unexpected_service_lookup():\n"
              "        raise AssertionError(\n"
              "            \"durable workspace recovery must not inspect global runs\"\n"
              "        )\n\n"
              "    monkeypatch.setattr(\n"
              "        \"vulnhunter.web.services.product_service\",\n"
              "        unexpected_service_lookup,\n"
              "    )\n\n"
              "    _restore_latest_non_terminal_run(request)\n\n"
              "    assert \"vulnhunter_conversation_state\" not in request.session\n"
              "    assert request.session.modified is False\n"
          )
          if "test_durable_empty_workspace_does_not_restore_another_live_run" not in text:
              marker = "\n\ndef test_apk_upload_preflight_rejects_insufficient_storage"
              if marker not in text:
                  raise SystemExit("Test insertion marker is missing")
              path.write_text(text.replace(marker, test + marker, 1), encoding="utf-8")
          PY
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-django ruff
          python -m ruff format \
            vulnhunter/web/conversational_views.py \
            vulnhunter/web/middleware.py \
            tests/unit/test_stale_conversation_state.py \
            tests/unit/test_product_consolidation_repairs.py
          python -m ruff check \
            vulnhunter/web/conversational_views.py \
            vulnhunter/web/middleware.py \
            tests/unit/test_stale_conversation_state.py \
            tests/unit/test_product_consolidation_repairs.py
          python -m pytest -q \
            tests/unit/test_stale_conversation_state.py \
            tests/unit/test_product_consolidation_repairs.py \
            tests/unit/test_persistent_conversation_threads.py \
            tests/unit/test_mobile_composer_contract.py
          rm -f \
            .github/workflows/temporary-workspace-run-isolation-pr.yml \
            .github/workflows/temporary-workspace-run-isolation-repair.yml \
            temporary-workspace-run-isolation-repair.trigger
          git config user.name 'vulnhunter-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Isolate assessment runs by durable workspace'
          git push origin HEAD:agent/full-system-audit

  repeated-suites:
    if: github.head_ref == 'agent/full-system-audit'
    name: 70x ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite:
          - reasoning
          - chat
          - workspaces
          - uploads
          - mobile
          - graph
          - source-hunt
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project and repeat tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio pytest-django pytest-repeat

      - name: Repeat suite seventy times
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.suite }}" in
            reasoning)
              python -m pytest -q --maxfail=1 --count=70 \
                tests/unit/test_conversation_reasoning.py
              ;;
            chat)
              python -m pytest -q --maxfail=1 --count=70 \
                tests/unit/test_conversation_core_redesign.py \
                tests/unit/test_conversation_experience.py \
                tests/unit/test_conversational_workspace.py
              ;;
            workspaces)
              python -m pytest -q --maxfail=1 --count=70 \
                tests/unit/test_persistent_conversation_threads.py
              ;;
            uploads)
              python -m pytest -q --maxfail=1 --count=70 \
                tests/unit/test_large_apk_upload.py
              ;;
            mobile)
              python -m pytest -q --maxfail=1 --count=70 \
                tests/unit/test_mobile_extension_endpoints.py \
                tests/unit/test_mobile_worker_runtime_repairs.py
              ;;
            graph)
              mapfile -t graph_tests < <(find tests -type f \( -iname '*graph*.py' -o -iname '*topology*.py' \) | sort)
              if [[ ${#graph_tests[@]} -eq 0 ]]; then
                python -m pytest -q --maxfail=1 --count=70 -k graph
              else
                python -m pytest -q --maxfail=1 --count=70 "${graph_tests[@]}"
              fi
              ;;
            source-hunt)
              shopt -s nullglob
              source_tests=(tests/unit/test_source_hunt*.py tests/unit/test_source_fix_verifier.py)
              if [[ ${#source_tests[@]} -eq 0 ]]; then
                echo 'Source-hunt tests are missing from the integration branch.' >&2
                exit 1
              fi
              python -m pytest -q --tb=short --maxfail=1 --count=70 "${source_tests[@]}" \
                2>&1 | tee /tmp/source-hunt-repeat.log
              ;;
          esac

      - name: Upload repeated-suite diagnostics
        if: always() && matrix.suite == 'source-hunt'
        uses: actions/upload-artifact@v6
        with:
          name: source-hunt-repeat-diagnostics
          path: /tmp/source-hunt-repeat.log
          if-no-files-found: warn
          retention-days: 7

  repeated-browser-ui:
    if: github.head_ref == 'agent/full-system-audit'
    name: Seven complete browser/UI cycles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VULNHUNTER_WEB_DEBUG: 'true'
      VULNHUNTER_WEB_DATABASE: /tmp/vh-stress-ui/web.sqlite3
      VULNHUNTER_AUTHORIZATION_DATABASE: /tmp/vh-stress-ui/auth.db
      VULNHUNTER_GOVERNANCE_DATABASE: /tmp/vh-stress-ui/governance.db
      VULNHUNTER_AGENT_DATABASE: /tmp/vh-stress-ui/agent.db
      VULNHUNTER_APPROVAL_DATABASE: /tmp/vh-stress-ui/approvals.sqlite3
      VULNHUNTER_AGENT_ACTIVITY_ROOT: /tmp/vh-stress-ui/activity
      VULNHUNTER_SECURITY_EVIDENCE_ROOT: /tmp/vh-stress-ui/evidence
      VULNHUNTER_MOBILE_ARTIFACT_ROOT: /tmp/vh-stress-ui/mobile
      VULNHUNTER_ADVERSARY_LAB_DATABASE: /tmp/vh-stress-ui/lab.sqlite3
      VULNHUNTER_UI_MANIFEST: /tmp/vh-stress-ui/ui-manifest.json
      VULNHUNTER_UI_OUTPUT: /tmp/vh-stress-ui/screenshots
      VULNHUNTER_UI_BASE_URL: http://127.0.0.1:8767
      VULNHUNTER_INTELLIGENCE_ENABLED: 'false'
      VULNHUNTER_GROQ_ENABLED: 'false'
      VULNHUNTER_NUCLEI_READINESS_REPORT: /tmp/vh-stress-ui/nuclei-readiness.json
      VULNHUNTER_NUCLEI_PILOT_ENQUEUE_ENABLED: 'true'
      VULNHUNTER_NUCLEI_WORKER_SIGNING_KEY_FILE: /tmp/vh-stress-ui/worker-signing.key
      VULNHUNTER_NUCLEI_WORKER_SPOOL_ROOT: /tmp/vh-stress-ui/worker-spool
      VULNHUNTER_SOURCE_HUNT_ROOTS: /tmp/vh-stress-ui/source-roots
      VULNHUNTER_SOURCE_HUNT_JOB_ROOT: /tmp/vh-stress-ui/source-jobs
      VULNHUNTER_SOURCE_HUNT_REPORT_ROOT: /tmp/vh-stress-ui/source-reports
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install application and browser tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio pytest-django
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare deterministic audit data
        run: |
          rm -rf /tmp/vh-stress-ui
          mkdir -p /tmp/vh-stress-ui/source-roots
          python manage.py migrate --noinput
          python tests/ui/prepare_visual_audit.py
          python tests/ui/prepare_conversation_e2e.py

      - name: Start local application
        run: |
          python manage.py runserver 127.0.0.1:8767 --noreload > /tmp/vh-stress-ui/server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8767/health/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vh-stress-ui/server.log
          exit 1

      - name: Run seven browser lifecycle and responsive audits
        shell: bash
        run: |
          set -euo pipefail
          for cycle in $(seq 1 7); do
            echo "Browser/UI cycle ${cycle}/7"
            node tests/ui/conversation_e2e.cjs
            node .playwright-validate.cjs
          done

      - name: Upload repeated UI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vulnhunter-70x7-ui-audit
          path: |
            /tmp/vh-stress-ui/screenshots
            /tmp/vh-stress-ui/server.log
          if-no-files-found: warn
          retention-days: 7
