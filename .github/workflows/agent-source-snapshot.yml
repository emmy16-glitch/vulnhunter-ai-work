name: Agent source snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/persistent-workspaces-uploads
          fetch-depth: 0
      - name: Build source archive
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -cJf "$RUNNER_TEMP/vulnhunter-source.tar.xz" .
      - name: Upload source archive
        uses: actions/upload-artifact@v6
        with:
          name: vulnhunter-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/vulnhunter-source.tar.xz
          retention-days: 1
