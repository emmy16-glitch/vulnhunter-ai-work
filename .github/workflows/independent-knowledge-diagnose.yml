name: Independent knowledge audit diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/independent-knowledge-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/independent-knowledge-integrity
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-django ruff
      - name: Apply isolated patch and capture validation
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/independent-knowledge-integrity.yml').read_text(
              encoding='utf-8'
          )
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/apply_knowledge_patch.py').write_text(script + '\n', encoding='utf-8')
          PY
          {
            python /tmp/apply_knowledge_patch.py
            python - <<'PY'
          from pathlib import Path

          path = Path('tests/unit/test_knowledge_ingestion.py')
          text = path.read_text(encoding='utf-8')
          old = '''    log = store.ingest_log_path.read_text(encoding="utf-8")
    for index in range(40):
        assert log.count(f"concurrent-entry-{index}") == 1
    assert not tuple(store.root.rglob("*.tmp"))
'''
          new = '''    log_lines = store.ingest_log_path.read_text(encoding="utf-8").splitlines()
    for index in range(40):
        assert log_lines.count(f"- concurrent-entry-{index}") == 1
    assert not tuple(store.root.rglob("*.tmp"))
'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('concurrency assertion marker is missing')
          path.write_text(text, encoding='utf-8')
          PY
            ruff format vulnhunter/knowledge/store.py tests/unit/test_knowledge_ingestion.py
            ruff check vulnhunter/knowledge/store.py tests/unit/test_knowledge_ingestion.py
            python -m pytest -q tests/unit/test_knowledge_ingestion.py tests/unit/test_knowledge_cli.py
          } > /tmp/knowledge-integrity-diagnostics.log 2>&1
          status=$?
          cat /tmp/knowledge-integrity-diagnostics.log
          echo "$status" > /tmp/knowledge-integrity-status.txt
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: independent-knowledge-integrity-diagnostics
          path: |
            /tmp/knowledge-integrity-diagnostics.log
            /tmp/knowledge-integrity-status.txt
          if-no-files-found: error
          retention-days: 3
      - name: Commit verified repair
        shell: bash
        run: |
          status="$(cat /tmp/knowledge-integrity-status.txt)"
          if [[ "$status" != "0" ]]; then
            exit "$status"
          fi
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'vulnhunter-integrity-bot'
          git config user.email 'vulnhunter-integrity-bot@users.noreply.github.com'
          git add vulnhunter/knowledge/store.py tests/unit/test_knowledge_ingestion.py
          git commit -m 'Harden controlled knowledge-store integrity'
          git push origin HEAD:agent/independent-knowledge-integrity
