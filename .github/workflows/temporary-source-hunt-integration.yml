name: Temporary source-hunt integration

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temporary-source-hunt-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/full-system-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Merge source-hunt history into current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'vulnhunter-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main agent/groq-source-hunt-loop
          git checkout -B agent/full-system-audit origin/main

          set +e
          git merge --no-ff -X ours origin/agent/groq-source-hunt-loop \
            -m 'Integrate source hunt with persistent workspaces'
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            mapfile -t unresolved < <(git diff --name-only --diff-filter=U)
            if [[ ${#unresolved[@]} -eq 0 ]]; then
              echo 'Merge failed without resolvable file conflicts.' >&2
              exit $merge_status
            fi
            printf 'Keeping current-main versions for conflicts:\n%s\n' "${unresolved[*]}"
            for path in "${unresolved[@]}"; do
              if git checkout --ours -- "$path" 2>/dev/null; then
                git add -- "$path"
              else
                git rm -f -- "$path"
              fi
            done
            git commit --no-edit
          fi

          rm -f .github/workflows/source-hunt-privacy-hardening.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove temporary source-hunt mutation workflow'
          fi
          git push --force origin HEAD:${{ github.event.pull_request.head.ref }}
