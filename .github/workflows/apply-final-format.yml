name: Apply final governance safety hardening

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/deep-independent-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deep-audit branch
        uses: actions/checkout@v6
        with:
          ref: agent/deep-independent-audit
          fetch-depth: 0
      - name: Apply governance fail-closed hardening
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/governance-safety.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/governance-safety.patch"
          git apply --check "$RUNNER_TEMP/governance-safety.patch"
          git apply "$RUNNER_TEMP/governance-safety.patch"
          rm .github/governance-safety.patch.gz.b64
          python -m pip install --disable-pip-version-check 'ruff==0.12.4'
          ruff format \
            tests/unit/test_deep_independent_audit.py \
            vulnhunter/web/governance_workspace_views.py \
            vulnhunter/web/services.py \
            vulnhunter/web/views.py
          ruff check \
            tests/unit/test_deep_independent_audit.py \
            vulnhunter/web/governance_workspace_views.py \
            vulnhunter/web/services.py \
            vulnhunter/web/views.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fail closed on governance storage errors"
          git push origin HEAD:agent/deep-independent-audit
