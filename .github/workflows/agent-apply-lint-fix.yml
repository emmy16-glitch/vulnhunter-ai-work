name: Apply final lint corrections

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/persistent-workspaces-uploads'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/persistent-workspaces-uploads
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply and verify corrections
        shell: bash
        run: |
          set -euo pipefail
          python .agent-fix-lint.py
          rm -f .agent-fix-lint.py
          python -m pip install 'ruff>=0.9,<1'
          ruff format .
          ruff check .
          ruff format --check .
          python -m compileall -q vulnhunter tests
          git add -A
          git diff --cached --check
      - name: Commit source corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix adaptive reasoning lint errors'
          git push origin HEAD:agent/persistent-workspaces-uploads
