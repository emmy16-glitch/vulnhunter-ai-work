name: Temporary remediation review core patch

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-review-core-patch.yml
      - scripts/patch_remediation_review_core.py

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'impl/independent-remediation-review' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: impl/independent-remediation-review
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: python scripts/patch_remediation_review_core.py
      - run: python -m ruff format vulnhunter/findings/models.py vulnhunter/findings/service.py vulnhunter/findings/__init__.py vulnhunter/assessment_graph/remediation.py vulnhunter/web/remediation_assessment_graph.py vulnhunter/findings/remediation_review.py tests/unit/test_independent_remediation_review.py tests/unit/test_remediation_review_graph.py
      - run: python -m ruff check --fix vulnhunter/findings/models.py vulnhunter/findings/service.py vulnhunter/findings/__init__.py vulnhunter/assessment_graph/remediation.py vulnhunter/web/remediation_assessment_graph.py vulnhunter/findings/remediation_review.py tests/unit/test_independent_remediation_review.py tests/unit/test_remediation_review_graph.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vulnhunter/findings/models.py vulnhunter/findings/service.py vulnhunter/findings/__init__.py vulnhunter/assessment_graph/remediation.py vulnhunter/web/remediation_assessment_graph.py vulnhunter/findings/remediation_review.py tests/unit/test_independent_remediation_review.py tests/unit/test_remediation_review_graph.py
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Implement independent remediation review core"
          git push origin HEAD:impl/independent-remediation-review
