name: Phone acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone-ui:
    name: Real mobile conversation and upload recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VULNHUNTER_WEB_DEBUG: "true"
      VULNHUNTER_WEB_DATABASE: /tmp/vh-phone/web.sqlite3
      VULNHUNTER_AUTHORIZATION_DATABASE: /tmp/vh-phone/auth.db
      VULNHUNTER_GOVERNANCE_DATABASE: /tmp/vh-phone/governance.db
      VULNHUNTER_AGENT_DATABASE: /tmp/vh-phone/agent.db
      VULNHUNTER_APPROVAL_DATABASE: /tmp/vh-phone/approvals.sqlite3
      VULNHUNTER_AGENT_ACTIVITY_ROOT: /tmp/vh-phone/activity
      VULNHUNTER_SECURITY_EVIDENCE_ROOT: /tmp/vh-phone/evidence
      VULNHUNTER_MOBILE_ARTIFACT_ROOT: /tmp/vh-phone/mobile
      VULNHUNTER_ADVERSARY_LAB_DATABASE: /tmp/vh-phone/lab.sqlite3
      VULNHUNTER_UI_MANIFEST: /tmp/vh-phone/ui-manifest.json
      VULNHUNTER_UI_OUTPUT: /tmp/vh-phone/screenshots
      VULNHUNTER_UI_BASE_URL: http://127.0.0.1:8767
      VULNHUNTER_GROQ_ENABLED: "false"
      VULNHUNTER_INTELLIGENCE_ENABLED: "false"
      VULNHUNTER_NUCLEI_READINESS_REPORT: /tmp/vh-phone/nuclei-readiness.json
      VULNHUNTER_NUCLEI_PILOT_ENQUEUE_ENABLED: "false"
      VULNHUNTER_NUCLEI_WORKER_SIGNING_KEY_FILE: /tmp/vh-phone/worker-signing.key
      VULNHUNTER_NUCLEI_WORKER_SPOOL_ROOT: /tmp/vh-phone/worker-spool
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check phone acceptance JavaScript
        run: node --check tests/ui/phone_acceptance_e2e.cjs

      - name: Install application and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio pytest-django
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prepare deterministic phone workspace
        shell: bash
        run: |
          set -o pipefail
          rm -rf /tmp/vh-phone
          mkdir -p /tmp/vh-phone/screenshots
          {
            python manage.py migrate --noinput
            python tests/ui/prepare_visual_audit.py
          } 2>&1 | tee /tmp/vh-phone/prepare.log

      - name: Start local application
        run: |
          python manage.py runserver 127.0.0.1:8767 --noreload > /tmp/vh-phone/server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8767/health/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vh-phone/server.log
          exit 1

      - name: Verify phone reasoning, provider status and upload recovery
        shell: bash
        run: |
          set -o pipefail
          node tests/ui/phone_acceptance_e2e.cjs 2>&1 | tee /tmp/vh-phone/acceptance.log

      - name: Upload phone diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: phone-acceptance-diagnostics
          path: |
            /tmp/vh-phone/screenshots
            /tmp/vh-phone/prepare.log
            /tmp/vh-phone/acceptance.log
            /tmp/vh-phone/server.log
          if-no-files-found: warn
          retention-days: 7
