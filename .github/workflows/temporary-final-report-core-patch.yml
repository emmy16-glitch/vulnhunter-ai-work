name: Temporary final report core patch

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-final-report-core-patch.yml
      - scripts/patch_final_report_core.py

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'impl/governed-final-report-generation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: impl/governed-final-report-generation
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: python scripts/patch_final_report_core.py
      - run: python -m ruff format vulnhunter/findings/models.py vulnhunter/findings/service.py vulnhunter/findings/__init__.py vulnhunter/reports/__init__.py vulnhunter/reports/final_remediation.py vulnhunter/assessment_graph/remediation.py vulnhunter/web/remediation_assessment_graph.py tests/unit/test_final_remediation_report.py tests/unit/test_final_remediation_report_graph.py
      - run: python -m ruff check --fix vulnhunter/findings/models.py vulnhunter/findings/service.py vulnhunter/findings/__init__.py vulnhunter/reports/__init__.py vulnhunter/reports/final_remediation.py vulnhunter/assessment_graph/remediation.py vulnhunter/web/remediation_assessment_graph.py tests/unit/test_final_remediation_report.py tests/unit/test_final_remediation_report_graph.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vulnhunter/findings/models.py vulnhunter/findings/service.py vulnhunter/findings/__init__.py vulnhunter/reports/__init__.py vulnhunter/reports/final_remediation.py vulnhunter/assessment_graph/remediation.py vulnhunter/web/remediation_assessment_graph.py tests/unit/test_final_remediation_report.py tests/unit/test_final_remediation_report_graph.py
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Implement governed final report core"
          git push origin HEAD:impl/governed-final-report-generation
