name: Temporary mobile formatter

on:
  push:
    branches:
      - feature/unified-chat-mobile-hunt

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/unified-chat-mobile-hunt
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Format expanded mobile Python
        run: |
          python -m pip install 'ruff>=0.9,<1'
          python -m ruff format \
            scripts/install_mobile_release_tools.py \
            scripts/mobile_androguard_adapter.py \
            scripts/mobile_yara_adapter.py \
            scripts/prepare_mobile_static_worker.py \
            vulnhunter/mobile/static_progress.py \
            vulnhunter/mobile/static_service.py \
            vulnhunter/mobile/static_toolchain.py \
            vulnhunter/mobile/static_worker.py \
            vulnhunter/mobile/mobsf.py \
            vulnhunter/hunt/mobile_graph.py \
            vulnhunter/hunt/mobile_runtime.py \
            tests/unit/test_mobile_hunt_runtime.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            scripts/install_mobile_release_tools.py \
            scripts/mobile_androguard_adapter.py \
            scripts/mobile_yara_adapter.py \
            scripts/prepare_mobile_static_worker.py \
            vulnhunter/mobile/static_progress.py \
            vulnhunter/mobile/static_service.py \
            vulnhunter/mobile/static_toolchain.py \
            vulnhunter/mobile/static_worker.py \
            vulnhunter/mobile/mobsf.py \
            vulnhunter/hunt/mobile_graph.py \
            vulnhunter/hunt/mobile_runtime.py \
            tests/unit/test_mobile_hunt_runtime.py
          git commit -m 'Apply Ruff formatting [mobile-format]'
          git push origin HEAD:feature/unified-chat-mobile-hunt
