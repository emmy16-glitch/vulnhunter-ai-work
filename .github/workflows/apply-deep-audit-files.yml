name: Apply deep-audit regression files

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/deep-independent-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deep-audit branch
        uses: actions/checkout@v6
        with:
          ref: agent/deep-independent-audit
          fetch-depth: 0

      - name: Add regression tests and unavailable page
        shell: bash
        run: |
          set -euxo pipefail
          base64 --decode .github/deep-audit-new-files.tar.gz.b64 > "$RUNNER_TEMP/deep-audit-new-files.tar.gz"
          gzip --test "$RUNNER_TEMP/deep-audit-new-files.tar.gz"
          tar -tzf "$RUNNER_TEMP/deep-audit-new-files.tar.gz"
          tar -xzf "$RUNNER_TEMP/deep-audit-new-files.tar.gz"
          test -s tests/unit/test_deep_independent_audit.py
          test -s vulnhunter/web/templates/web/unavailable.html
          rm .github/deep-audit-new-files.tar.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add deep role and failure-boundary regressions"
          git push origin HEAD:agent/deep-independent-audit
