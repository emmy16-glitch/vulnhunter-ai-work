name: Apply final canonical formatting

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/deep-independent-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deep-audit branch
        uses: actions/checkout@v6
        with:
          ref: agent/deep-independent-audit
          fetch-depth: 0
      - name: Apply exact Ruff formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'ruff==0.12.4'
          ruff format \
            tests/unit/test_deep_independent_audit.py \
            tests/unit/test_product_interface_specification.py \
            tests/unit/test_reference_ui_contract.py \
            vulnhunter/product_spec/registry.py \
            vulnhunter/web/views.py
          rm -f .github/final-format.patch.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply canonical formatting to final audit"
          git push origin HEAD:agent/deep-independent-audit
