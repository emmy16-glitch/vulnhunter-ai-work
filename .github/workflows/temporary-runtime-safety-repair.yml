name: Temporary runtime safety repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-runtime-safety-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/unified-chat-mobile-hunt
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply structural fail-closed repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path("vulnhunter/mobile/runtime.py")
          runtime = runtime_path.read_text(encoding="utf-8")
          runtime_guard = "runtime cleanup could not remove the approved package"
          if runtime_guard not in runtime:
              lines = runtime.splitlines()
              matches = [
                  index
                  for index, line in enumerate(lines)
                  if line.strip() == "captures.extend(self._cleanup(package_name))"
              ]
              if len(matches) != 1:
                  raise SystemExit("runtime cleanup call did not match exactly once")
              call_index = matches[0]
              if call_index < 2 or lines[call_index - 2].strip() != "finally:" or lines[call_index - 1].strip() != "if installed:":
                  raise SystemExit("runtime cleanup call is outside the expected finally block")
              replacement = [
                  "        finally:",
                  "            if installed:",
                  "                try:",
                  "                    cleanup = self._cleanup(package_name)",
                  "                except (OSError, subprocess.SubprocessError, MobileRuntimeError) as exc:",
                  "                    if failure is None:",
                  "                        failure = exc",
                  "                else:",
                  "                    captures.extend(cleanup)",
                  "                    if failure is None and any(item.return_code != 0 for item in cleanup):",
                  "                        failure = MobileRuntimeError(",
                  f'                            "{runtime_guard}"',
                  "                        )",
              ]
              lines[call_index - 2 : call_index + 1] = replacement
              runtime_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          spool_path = Path("vulnhunter/mobile/extension_spool.py")
          spool = spool_path.read_text(encoding="utf-8")
          spool_guard = "malformed_identity = canonical_job_id is None"
          if spool_guard not in spool:
              start = spool.find("    def reject(self, claimed: Path, *, reason: str, now: datetime) -> Path:\n")
              end = spool.find("    def recover_processing(self, *, now: datetime) -> None:\n")
              if start < 0 or end <= start:
                  raise SystemExit("extension reject function boundaries were not found")
              replacement = '''    def reject(self, claimed: Path, *, reason: str, now: datetime) -> Path:
              if claimed.parent != self.processing or claimed.is_symlink() or not claimed.is_file():
                  raise MobileExtensionSpoolError("claimed extension job path is unsafe")
              try:
                  raw_text = claimed.read_text(encoding="utf-8")
                  raw = json.loads(raw_text)
              except (OSError, ValueError):
                  raw_text = ""
                  raw = {}
              if not isinstance(raw, dict):
                  raw = {}
              raw_job_id = str(raw.get("job_id") or "")
              canonical_job_id = (
                  raw_job_id
                  if _IDENTIFIER.fullmatch(raw_job_id) is not None
                  and claimed.name == self._filename(raw_job_id)
                  else None
              )
              malformed_identity = canonical_job_id is None
              instant = _utc(now)
              if malformed_identity:
                  seed = f"{claimed.name}\\0{raw_text}\\0{instant.isoformat()}".encode("utf-8")
                  job_id = f"rejected-{hashlib.sha256(seed).hexdigest()[:20]}"
              else:
                  job_id = canonical_job_id
              raw_kind = str(raw.get("kind") or "mobsf")
              kind: ExtensionKind = "runtime" if raw_kind == "runtime" else "mobsf"
              raw_artifact_id = str(raw.get("artifact_id") or "")
              artifact_id = (
                  raw_artifact_id
                  if _IDENTIFIER.fullmatch(raw_artifact_id) is not None
                  else "unknown-artifact"
              )
              safe_reason = " ".join(reason.split())[:500]
              if len(safe_reason) < 3:
                  safe_reason = "Malformed extension job rejected."
              unsigned = {
                  "job_id": job_id,
                  "kind": kind,
                  "artifact_id": artifact_id,
                  "state": "rejected",
                  "completed_at": instant.isoformat(),
                  "reason": safe_reason,
                  "evidence": {},
              }
              receipt = MobileExtensionReceipt(
                  **unsigned,
                  result_sha256=hashlib.sha256(
                      json.dumps(unsigned, sort_keys=True, separators=(",", ":")).encode()
                  ).hexdigest(),
              )
              if malformed_identity:
                  target = self.failed / self._filename(job_id)
                  self._write_exclusive(target, receipt.model_dump_json(indent=2) + "\\n")
                  claimed.unlink(missing_ok=True)
                  return target
              return self.finish(claimed, receipt=receipt, success=False)

          '''
              spool_path.write_text(spool[:start] + replacement + spool[end:], encoding="utf-8")
          PY
      - name: Format and validate repaired files
        run: |
          python -m pip install 'ruff>=0.9,<1'
          python -m ruff format vulnhunter/mobile/runtime.py vulnhunter/mobile/extension_spool.py
          python -m ruff check vulnhunter/mobile/runtime.py vulnhunter/mobile/extension_spool.py
          python -m ruff format --check vulnhunter/mobile/runtime.py vulnhunter/mobile/extension_spool.py
      - name: Commit exact repair if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vulnhunter/mobile/runtime.py vulnhunter/mobile/extension_spool.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fail closed on malformed extension jobs and cleanup errors [runtime-safety-repair]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin feature/unified-chat-mobile-hunt || {
              git rebase --abort || true
              sleep 2
              continue
            }
            if git push origin HEAD:feature/unified-chat-mobile-hunt; then
              exit 0
            fi
            sleep 2
          done
          exit 1
