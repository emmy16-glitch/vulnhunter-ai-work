name: Temporary retest documentation patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary-retest-doc-patch.yml
      - scripts/patch_retest_documentation.py

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'impl/governed-retest-review-readiness' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: impl/governed-retest-review-readiness
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/patch_retest_documentation.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/intelligence/VULNHUNTER_MASTER_ARCHITECTURE.md
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Document test-engineered retest milestone"
          git push origin HEAD:impl/governed-retest-review-readiness
