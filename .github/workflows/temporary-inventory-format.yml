name: Temporary inventory formatter

on:
  push:
    branches:
      - agent/fix-repository-inventory-race

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[inventory-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-repository-inventory-race
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install 'ruff>=0.9,<1'
          python -m ruff format vulnhunter/repository_coverage/service.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vulnhunter/repository_coverage/service.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Format repository inventory race fix [inventory-format]'
          git push origin HEAD:agent/fix-repository-inventory-race
