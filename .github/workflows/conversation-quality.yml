name: Conversational workspace quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-extension-safety:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 34 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/unified-chat-mobile-hunt
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply exact fail-closed repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path("vulnhunter/mobile/runtime.py")
          runtime = runtime_path.read_text(encoding="utf-8")
          old_runtime = '''        finally:
              if installed:
                  captures.extend(self._cleanup(package_name))
          if time.monotonic() - started > self.policy.maximum_session_seconds:
          '''
          new_runtime = '''        finally:
              if installed:
                  try:
                      cleanup = self._cleanup(package_name)
                  except (OSError, subprocess.SubprocessError, MobileRuntimeError) as exc:
                      if failure is None:
                          failure = exc
                  else:
                      captures.extend(cleanup)
                      if failure is None and any(item.return_code != 0 for item in cleanup):
                          failure = MobileRuntimeError(
                              "runtime cleanup could not remove the approved package"
                          )
          if time.monotonic() - started > self.policy.maximum_session_seconds:
          '''
          if old_runtime in runtime:
              runtime_path.write_text(runtime.replace(old_runtime, new_runtime, 1), encoding="utf-8")
          elif "runtime cleanup could not remove the approved package" not in runtime:
              raise SystemExit("runtime cleanup anchor is missing")

          spool_path = Path("vulnhunter/mobile/extension_spool.py")
          spool = spool_path.read_text(encoding="utf-8")
          old_spool = '''    def reject(self, claimed: Path, *, reason: str, now: datetime) -> Path:
              if claimed.parent != self.processing or claimed.is_symlink() or not claimed.is_file():
                  raise MobileExtensionSpoolError("claimed extension job path is unsafe")
              try:
                  raw = json.loads(claimed.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  raw = {}
              job_id = str(raw.get("job_id") or claimed.stem)
              raw_kind = str(raw.get("kind") or "mobsf")
              kind: ExtensionKind = "runtime" if raw_kind == "runtime" else "mobsf"
              artifact_id = str(raw.get("artifact_id") or "unknown-artifact")
              unsigned = {
                  "job_id": job_id,
                  "kind": kind,
                  "artifact_id": artifact_id,
                  "state": "rejected",
                  "completed_at": _utc(now).isoformat(),
                  "reason": reason[:500],
                  "evidence": {},
              }
              receipt = MobileExtensionReceipt(
                  **unsigned,
                  result_sha256=hashlib.sha256(
                      json.dumps(unsigned, sort_keys=True, separators=(",", ":")).encode()
                  ).hexdigest(),
              )
              return self.finish(claimed, receipt=receipt, success=False)
          '''
          new_spool = '''    def reject(self, claimed: Path, *, reason: str, now: datetime) -> Path:
              if claimed.parent != self.processing or claimed.is_symlink() or not claimed.is_file():
                  raise MobileExtensionSpoolError("claimed extension job path is unsafe")
              try:
                  raw_text = claimed.read_text(encoding="utf-8")
                  raw = json.loads(raw_text)
              except (OSError, ValueError):
                  raw_text = ""
                  raw = {}
              if not isinstance(raw, dict):
                  raw = {}
              raw_job_id = str(raw.get("job_id") or "")
              canonical_job_id = (
                  raw_job_id
                  if _IDENTIFIER.fullmatch(raw_job_id) is not None
                  and claimed.name == self._filename(raw_job_id)
                  else None
              )
              malformed_identity = canonical_job_id is None
              instant = _utc(now)
              if malformed_identity:
                  seed = f"{claimed.name}\\0{raw_text}\\0{instant.isoformat()}".encode("utf-8")
                  job_id = f"rejected-{hashlib.sha256(seed).hexdigest()[:20]}"
              else:
                  job_id = canonical_job_id
              raw_kind = str(raw.get("kind") or "mobsf")
              kind: ExtensionKind = "runtime" if raw_kind == "runtime" else "mobsf"
              raw_artifact_id = str(raw.get("artifact_id") or "")
              artifact_id = (
                  raw_artifact_id
                  if _IDENTIFIER.fullmatch(raw_artifact_id) is not None
                  else "unknown-artifact"
              )
              safe_reason = " ".join(reason.split())[:500]
              if len(safe_reason) < 3:
                  safe_reason = "Malformed extension job rejected."
              unsigned = {
                  "job_id": job_id,
                  "kind": kind,
                  "artifact_id": artifact_id,
                  "state": "rejected",
                  "completed_at": instant.isoformat(),
                  "reason": safe_reason,
                  "evidence": {},
              }
              receipt = MobileExtensionReceipt(
                  **unsigned,
                  result_sha256=hashlib.sha256(
                      json.dumps(unsigned, sort_keys=True, separators=(",", ":")).encode()
                  ).hexdigest(),
              )
              if malformed_identity:
                  target = self.failed / self._filename(job_id)
                  self._write_exclusive(target, receipt.model_dump_json(indent=2) + "\\n")
                  claimed.unlink(missing_ok=True)
                  return target
              return self.finish(claimed, receipt=receipt, success=False)
          '''
          if old_spool in spool:
              spool_path.write_text(spool.replace(old_spool, new_spool, 1), encoding="utf-8")
          elif "malformed_identity = canonical_job_id is None" not in spool:
              raise SystemExit("extension reject anchor is missing")
          PY
      - name: Format, commit and push repairs
        run: |
          python -m pip install 'ruff>=0.9,<1'
          python -m ruff format vulnhunter/mobile/runtime.py vulnhunter/mobile/extension_spool.py
          python -m ruff check vulnhunter/mobile/runtime.py vulnhunter/mobile/extension_spool.py
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vulnhunter/mobile/runtime.py vulnhunter/mobile/extension_spool.py
          git commit -m 'Fail closed on malformed extension jobs and cleanup errors [runtime-safety-repair]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase -X theirs origin feature/unified-chat-mobile-hunt || {
              git rebase --abort || true
              sleep 2
              continue
            }
            if git push origin HEAD:feature/unified-chat-mobile-hunt; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  conversation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VULNHUNTER_WEB_DEBUG: "true"
      VULNHUNTER_WEB_DATABASE: /tmp/vh-conversation/web.sqlite3
      VULNHUNTER_AUTHORIZATION_DATABASE: /tmp/vh-conversation/auth.db
      VULNHUNTER_GOVERNANCE_DATABASE: /tmp/vh-conversation/governance.db
      VULNHUNTER_AGENT_DATABASE: /tmp/vh-conversation/agent.db
      VULNHUNTER_APPROVAL_DATABASE: /tmp/vh-conversation/approvals.sqlite3
      VULNHUNTER_AGENT_ACTIVITY_ROOT: /tmp/vh-conversation/activity
      VULNHUNTER_SECURITY_EVIDENCE_ROOT: /tmp/vh-conversation/evidence
      VULNHUNTER_MOBILE_ARTIFACT_ROOT: /tmp/vh-conversation/mobile-artifacts
      VULNHUNTER_MOBILE_STATIC_SPOOL_ROOT: /tmp/vh-conversation/mobile-static-spool
      VULNHUNTER_MOBILE_STATIC_ENQUEUE_ENABLED: "false"
      VULNHUNTER_ADVERSARY_LAB_DATABASE: /tmp/vh-conversation/lab.sqlite3
      VULNHUNTER_GROQ_ENABLED: "false"
      VULNHUNTER_INTELLIGENCE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install application and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio pytest-django ruff
      - name: Check conversational JavaScript
        run: |
          node --check vulnhunter/web/static/web/conversation-runtime-compat.js
          node --check vulnhunter/web/static/web/conversation.js
          node --check vulnhunter/web/static/web/conversation-mobile-bridge.js
          node --check vulnhunter/web/static/web/conversation-mobile.js
          node --check vulnhunter/web/static/web/conversation-mobile-context.js
          node --check vulnhunter/web/static/web/conversation-mobile-inspector.js
          node --check vulnhunter/web/static/web/conversation-mobile-deferred-tools.js
          node --check vulnhunter/web/static/web/conversation-autoscroll.js
          node tests/ui/chat_runtime_compat.cjs
      - name: Check conversational, mobile and intelligence Python
        run: |
          set +e
          python -m ruff check \
            scripts/configure_mobsf.py \
            scripts/install_mobile_release_tools.py \
            scripts/mobile_androguard_adapter.py \
            scripts/mobile_frida_inventory.py \
            scripts/mobile_yara_adapter.py \
            scripts/prepare_mobile_static_worker.py \
            scripts/register_mobile_runtime.py \
            vulnhunter/scope/validator.py \
            vulnhunter/mobile/extension_service.py \
            vulnhunter/mobile/extension_spool.py \
            vulnhunter/mobile/mobsf.py \
            vulnhunter/mobile/runtime.py \
            vulnhunter/mobile/static_progress.py \
            vulnhunter/mobile/static_service.py \
            vulnhunter/mobile/static_spool.py \
            vulnhunter/mobile/static_toolchain.py \
            vulnhunter/mobile/static_worker.py \
            vulnhunter/web/conversation_service.py \
            vulnhunter/web/conversation_state.py \
            vulnhunter/web/conversation_attachments.py \
            vulnhunter/web/conversation_mobile_extension_views.py \
            vulnhunter/web/conversation_mobile_views.py \
            vulnhunter/web/mobile_conversation.py \
            vulnhunter/web/mobile_conversation_state.py \
            vulnhunter/web/mobile_execution.py \
            vulnhunter/web/mobile_extension_execution.py \
            vulnhunter/web/mobile_infrastructure.py \
            vulnhunter/web/conversational_authorization.py \
            vulnhunter/web/conversational_views.py \
            vulnhunter/web/conversation_approval_views.py \
            vulnhunter/web/inline_confirmation_store.py \
            vulnhunter/web/dashboard_dispatch_views.py \
            vulnhunter/web/management/commands/vh_configure_groq.py \
            vulnhunter/web/management/commands/vh_prepare_private_lab.py \
            vulnhunter/web/management/commands/vh_run_intelligence_worker.py \
            vulnhunter/web/management/commands/vh_run_mobile_extension_worker.py \
            vulnhunter/web/management/commands/vh_run_mobile_static_worker.py \
            vulnhunter/hunt \
            vulnhunter/intelligence \
            vulnhunter/security/redaction.py \
            vulnhunter/security/sensitive_patterns.py \
            tests/unit/test_chat_runtime_reply.py \
            tests/unit/test_conversation_core_redesign.py \
            tests/unit/test_conversational_url_targets.py \
            tests/unit/test_conversation_experience.py \
            tests/unit/test_conversational_workspace.py \
            tests/unit/test_inline_confirmation_endpoint.py \
            tests/unit/test_inline_confirmation_store.py \
            tests/unit/test_intelligence_loop.py \
            tests/unit/test_mobile_chat_hunt.py \
            tests/unit/test_mobile_extension_execution.py \
            tests/unit/test_mobile_extension_ui.py \
            tests/unit/test_mobile_hunt_runtime.py \
            tests/unit/test_mobile_infrastructure_runtime.py \
            tests/unit/test_redaction.py \
            >conversation-quality.log 2>&1
          lint_status=$?
          python -m ruff format --check \
            scripts/configure_mobsf.py \
            scripts/install_mobile_release_tools.py \
            scripts/mobile_androguard_adapter.py \
            scripts/mobile_frida_inventory.py \
            scripts/mobile_yara_adapter.py \
            scripts/prepare_mobile_static_worker.py \
            scripts/register_mobile_runtime.py \
            vulnhunter/scope/validator.py \
            vulnhunter/mobile/extension_service.py \
            vulnhunter/mobile/extension_spool.py \
            vulnhunter/mobile/mobsf.py \
            vulnhunter/mobile/runtime.py \
            vulnhunter/mobile/static_progress.py \
            vulnhunter/mobile/static_service.py \
            vulnhunter/mobile/static_spool.py \
            vulnhunter/mobile/static_toolchain.py \
            vulnhunter/mobile/static_worker.py \
            vulnhunter/web/conversation_service.py \
            vulnhunter/web/conversation_state.py \
            vulnhunter/web/conversation_attachments.py \
            vulnhunter/web/conversation_mobile_extension_views.py \
            vulnhunter/web/conversation_mobile_views.py \
            vulnhunter/web/mobile_conversation.py \
            vulnhunter/web/mobile_conversation_state.py \
            vulnhunter/web/mobile_execution.py \
            vulnhunter/web/mobile_extension_execution.py \
            vulnhunter/web/mobile_infrastructure.py \
            vulnhunter/web/conversational_authorization.py \
            vulnhunter/web/conversational_views.py \
            vulnhunter/web/conversation_approval_views.py \
            vulnhunter/web/inline_confirmation_store.py \
            vulnhunter/web/dashboard_dispatch_views.py \
            vulnhunter/web/management/commands/vh_configure_groq.py \
            vulnhunter/web/management/commands/vh_prepare_private_lab.py \
            vulnhunter/web/management/commands/vh_run_intelligence_worker.py \
            vulnhunter/web/management/commands/vh_run_mobile_extension_worker.py \
            vulnhunter/web/management/commands/vh_run_mobile_static_worker.py \
            vulnhunter/hunt \
            vulnhunter/intelligence \
            vulnhunter/security/redaction.py \
            vulnhunter/security/sensitive_patterns.py \
            tests/unit/test_chat_runtime_reply.py \
            tests/unit/test_conversation_core_redesign.py \
            tests/unit/test_conversational_url_targets.py \
            tests/unit/test_conversation_experience.py \
            tests/unit/test_conversational_workspace.py \
            tests/unit/test_inline_confirmation_endpoint.py \
            tests/unit/test_inline_confirmation_store.py \
            tests/unit/test_intelligence_loop.py \
            tests/unit/test_mobile_chat_hunt.py \
            tests/unit/test_mobile_extension_execution.py \
            tests/unit/test_mobile_extension_ui.py \
            tests/unit/test_mobile_hunt_runtime.py \
            tests/unit/test_mobile_infrastructure_runtime.py \
            tests/unit/test_redaction.py \
            >>conversation-quality.log 2>&1
          format_status=$?
          cat conversation-quality.log
          if [[ $lint_status -ne 0 || $format_status -ne 0 ]]; then
            exit 1
          fi
      - name: Upload conversational quality diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: conversational-quality-log
          path: conversation-quality.log
          retention-days: 3
      - name: Run conversational, mobile and intelligence tests
        run: |
          python manage.py migrate --noinput
          python -m pytest -q \
            tests/unit/test_chat_runtime_reply.py \
            tests/unit/test_conversation_core_redesign.py \
            tests/unit/test_conversational_url_targets.py \
            tests/unit/test_conversation_experience.py \
            tests/unit/test_conversational_workspace.py \
            tests/unit/test_inline_confirmation_endpoint.py \
            tests/unit/test_inline_confirmation_store.py \
            tests/unit/test_intelligence_loop.py \
            tests/unit/test_mobile_chat_hunt.py \
            tests/unit/test_mobile_extension_execution.py \
            tests/unit/test_mobile_extension_ui.py \
            tests/unit/test_mobile_hunt_runtime.py \
            tests/unit/test_mobile_infrastructure_runtime.py \
            tests/unit/test_redaction.py
      - name: Verify launcher and configuration syntax
        run: |
          python -m json.tool .devcontainer/devcontainer.json >/dev/null
          python -m json.tool config/security_tools/mobile_yara/manifest.json >/dev/null
          python -m py_compile \
            scripts/configure_mobsf.py \
            scripts/install_mobile_release_tools.py \
            scripts/mobile_androguard_adapter.py \
            scripts/mobile_frida_inventory.py \
            scripts/mobile_yara_adapter.py \
            scripts/prepare_mobile_static_worker.py \
            scripts/register_mobile_runtime.py \
            vulnhunter/mobile/extension_service.py \
            vulnhunter/mobile/extension_spool.py \
            vulnhunter/web/conversation_mobile_extension_views.py \
            vulnhunter/web/mobile_extension_execution.py \
            vulnhunter/web/management/commands/vh_run_mobile_extension_worker.py
          bash -n .devcontainer/configure-mobile-extensions.sh
          bash -n .devcontainer/first-run.sh
          bash -n .devcontainer/install-codex.sh
          bash -n .devcontainer/install-mobile-static-tools.sh
          bash -n .devcontainer/post-create.sh
          bash -n .devcontainer/start-vulnhunter.sh
          bash -n .devcontainer/start-phone-lab.sh
          bash -n scripts/start-mobsf-private.sh
