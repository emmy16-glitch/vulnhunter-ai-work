name: Apply final persistent workspace repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/persistent-workspaces-uploads'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/persistent-workspaces-uploads
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Decode and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .agent-final.part00 > "$RUNNER_TEMP/final.diff.xz"
          echo '2074905f0c77cc4e85abf7e6ec54dedb0f2214f83203445b99809c296668227f  '"$RUNNER_TEMP/final.diff.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/final.diff.xz" > "$RUNNER_TEMP/final.diff"
          git apply --binary --index "$RUNNER_TEMP/final.diff"
          git rm -f .agent-final.part00 .github/workflows/agent-apply-final.yml
      - name: Install formatting tools
        run: python -m pip install 'ruff>=0.9,<1'
      - name: Format and lint changed source
        shell: bash
        run: |
          set -euo pipefail
          ruff format .
          ruff check --fix .
          ruff check .
          ruff format --check .
          git add -A
          git diff --cached --check
      - name: Compile and check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q vulnhunter tests
          for file in vulnhunter/web/static/web/*.js; do node --check "$file"; done
          bash -n .devcontainer/start-vulnhunter.sh
      - name: Commit repaired implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete persistent workspaces and adaptive reasoning'
          git push origin HEAD:agent/persistent-workspaces-uploads
