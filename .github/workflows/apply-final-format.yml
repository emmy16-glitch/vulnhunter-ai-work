name: Apply final canonical formatting

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/deep-independent-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deep-audit branch
        uses: actions/checkout@v6
        with:
          ref: agent/deep-independent-audit
          fetch-depth: 0
      - name: Apply exact Ruff formatting
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/final-format.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/final-format.patch"
          git apply --check "$RUNNER_TEMP/final-format.patch"
          git apply "$RUNNER_TEMP/final-format.patch"
          rm .github/final-format.patch.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply canonical formatting to final audit"
          git push origin HEAD:agent/deep-independent-audit
