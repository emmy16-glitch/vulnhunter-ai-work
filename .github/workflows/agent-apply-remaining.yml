name: Apply remaining persistent workspace files

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/persistent-workspaces-uploads
          fetch-depth: 0
      - name: Rebuild and verify exact archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .agent-remaining.part00a \
            .agent-remaining.part00b \
            .agent-remaining.part01 \
            .agent-remaining.part02 \
            .agent-remaining.part03 \
            .agent-remaining.part04 \
            | base64 -d > "$RUNNER_TEMP/remaining-files.tar.gz"
          actual="$(sha256sum "$RUNNER_TEMP/remaining-files.tar.gz" | awk '{print $1}')"
          echo "archive sha256: $actual"
          test "$actual" = "76367ffec94731c306b57416759c9de600a6385c6330c392b3471c979960b545"
          tar -tzf "$RUNNER_TEMP/remaining-files.tar.gz"
      - name: Extract exact files
        run: tar -xzf "$RUNNER_TEMP/remaining-files.tar.gz" -C .
      - name: Validate extracted implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            vulnhunter/web/conversation_service.py \
            vulnhunter/web/conversational_views.py
          node --check vulnhunter/web/static/web/conversation.js
          git diff --check
      - name: Remove archive payloads
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .agent-remaining.part00 \
            .agent-remaining.part00a \
            .agent-remaining.part00b \
            .agent-remaining.part01 \
            .agent-remaining.part02 \
            .agent-remaining.part03 \
            .agent-remaining.part04
          git add -A
          git diff --cached --check
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VulnHunter automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Complete persistent workspace and upload integration"
      - name: Push implementation
        run: git push origin HEAD:agent/persistent-workspaces-uploads
