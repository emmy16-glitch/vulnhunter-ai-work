name: Temporary Source Hunt Accessibility Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/groq-source-hunt-loop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Name Source Hunt controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('vulnhunter/web/templates/web/source_hunt.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '<input type="password" name="password" autocomplete="current-password" required>': (
                  '<input id="source-hunt-password" type="password" name="password" '
                  'autocomplete="current-password" aria-label="Password re-authentication" required>'
              ),
              '<input type="checkbox" name="approve_remote_processing" value="yes" required>': (
                  '<input id="source-hunt-remote-approval" type="checkbox" '
                  'name="approve_remote_processing" value="yes" '
                  'aria-label="Approve Groq source processing" required>'
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one accessibility match: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit accessibility repair
        shell: bash
        run: |
          git config user.name 'vulnhunter-quality-bot'
          git config user.email 'vulnhunter-quality-bot@users.noreply.github.com'
          git add vulnhunter/web/templates/web/source_hunt.html
          git commit -m 'Name Source Hunt form controls'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
