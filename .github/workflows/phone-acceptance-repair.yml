name: Apply phone acceptance repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/phone-acceptance-repair' &&
      contains(github.event.pull_request.changed_files && 'true' || 'true', 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/phone-acceptance-repair
          fetch-depth: 0

      - name: Stop when the repair was already applied
        id: guard
        shell: bash
        run: |
          if [[ ! -f scripts/apply_phone_acceptance_repair.py ]]; then
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.apply == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node
        if: steps.guard.outputs.apply == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Apply bounded repair
        if: steps.guard.outputs.apply == 'true'
        run: python scripts/apply_phone_acceptance_repair.py

      - name: Install project and test tools
        if: steps.guard.outputs.apply == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Format and lint repaired files
        if: steps.guard.outputs.apply == 'true'
        run: |
          python -m ruff format \
            vulnhunter/providers/groq.py \
            vulnhunter/web/conversation_service.py \
            vulnhunter/web/management/commands/vh_verify_groq.py \
            tests/unit/test_phone_acceptance_repairs.py
          python -m ruff check \
            vulnhunter/providers/groq.py \
            vulnhunter/web/conversation_service.py \
            vulnhunter/web/management/commands/vh_verify_groq.py \
            tests/unit/test_phone_acceptance_repairs.py
          node --check vulnhunter/web/static/web/conversation.js
          node --check vulnhunter/web/static/web/conversation-upload-coordinator.js
          bash -n .devcontainer/start-vulnhunter.sh
          bash -n .devcontainer/post-create.sh

      - name: Run focused acceptance tests
        if: steps.guard.outputs.apply == 'true'
        run: |
          python manage.py migrate --noinput
          python -m pytest -q \
            tests/unit/test_phone_acceptance_repairs.py \
            tests/unit/test_groq_provider.py \
            tests/unit/test_verify_groq_command.py \
            tests/unit/test_conversation_reasoning.py \
            tests/unit/test_conversation_experience.py \
            tests/unit/test_persistent_conversation_threads.py \
            tests/unit/test_large_apk_upload.py \
            tests/unit/test_mobile_composer_contract.py \
            tests/unit/test_codespaces_configuration.py

      - name: Run complete Python suite
        if: steps.guard.outputs.apply == 'true'
        run: python -m pytest -q

      - name: Commit only the verified product repair
        if: steps.guard.outputs.apply == 'true'
        shell: bash
        run: |
          rm -f scripts/apply_phone_acceptance_repair.py .github/workflows/phone-acceptance-repair.yml
          git config user.name 'vulnhunter-acceptance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Repair live phone conversation and upload acceptance'
          git push origin HEAD:agent/phone-acceptance-repair
