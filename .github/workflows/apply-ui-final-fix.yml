name: Apply final UI audit corrections

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/deep-independent-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deep-audit branch
        uses: actions/checkout@v6
        with:
          ref: agent/deep-independent-audit
          fetch-depth: 0
      - name: Apply exact browser-audit corrections
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/ui-final-fix.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/ui-final-fix.patch"
          git apply --check "$RUNNER_TEMP/ui-final-fix.patch"
          git apply "$RUNNER_TEMP/ui-final-fix.patch"
          rm .github/ui-final-fix.patch.gz.b64
          node --check .playwright-validate.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix final browser audit findings"
          git push origin HEAD:agent/deep-independent-audit
