name: Apply audited repository patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/final-wiring-and-ui-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v6
        with:
          ref: agent/final-wiring-and-ui-audit
          fetch-depth: 0

      - name: Apply verified audit patch
        shell: bash
        run: |
          set -euo pipefail

          cat .github/vh-audit-patch-*.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/vulnhunter-audit.patch

          # Restore the exact temporary workflow content expected by the audited
          # patch. The patch then removes this workflow from the final branch.
          cat > .github/workflows/audit-source-snapshot.yml <<'WORKFLOW'
          name: Audit source snapshot

          on:
            pull_request:

          permissions:
            contents: read

          jobs:
            snapshot:
              runs-on: ubuntu-latest
              steps:
                - name: Check out repository
                  uses: actions/checkout@v6

                - name: Upload audit source snapshot
                  uses: actions/upload-artifact@v6
                  with:
                    name: vulnhunter-audit-source
                    path: |
                      .
                      !.git
                    include-hidden-files: true
                    if-no-files-found: error
                    retention-days: 1
          WORKFLOW

          sed -i 's/^          //' .github/workflows/audit-source-snapshot.yml

          git apply --check /tmp/vulnhunter-audit.patch
          git apply /tmp/vulnhunter-audit.patch
          rm -f .github/vh-audit-patch-*.b64

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Consolidate navigation and remove stale web wiring"
          git push origin HEAD:agent/final-wiring-and-ui-audit
