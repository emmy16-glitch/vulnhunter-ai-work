name: Apply final persistent workspace repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/persistent-workspaces-uploads'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/persistent-workspaces-uploads
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Decode and apply exact patch
        shell: bash
        run: |
          set -o pipefail
          set +e
          {
            set -x
            wc -c .agent-final.part00
            base64 -d .agent-final.part00 > "$RUNNER_TEMP/final.diff.xz"
            sha256sum "$RUNNER_TEMP/final.diff.xz"
            echo '2074905f0c77cc4e85abf7e6ec54dedb0f2214f83203445b99809c296668227f  '"$RUNNER_TEMP/final.diff.xz" | sha256sum -c -
            xz -t "$RUNNER_TEMP/final.diff.xz"
            xz -dc "$RUNNER_TEMP/final.diff.xz" > "$RUNNER_TEMP/final.diff"
            git status --short
            git apply --check --verbose "$RUNNER_TEMP/final.diff"
            git apply --binary --index "$RUNNER_TEMP/final.diff"
            git rm -f .agent-final.part00 .github/workflows/agent-apply-final.yml
          } 2>&1 | tee "$RUNNER_TEMP/final-apply.log"
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload application diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: final-apply-diagnostic
          path: ${{ runner.temp }}/final-apply.log
          if-no-files-found: error
          retention-days: 1
      - name: Install formatting tools
        run: python -m pip install 'ruff>=0.9,<1'
      - name: Format and lint changed source
        shell: bash
        run: |
          set -o pipefail
          set +e
          {
            set -x
            ruff format .
            ruff check --fix .
            ruff check .
            ruff format --check .
            git add -A
            git diff --cached --check
          } 2>&1 | tee "$RUNNER_TEMP/final-lint.log"
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload lint diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: final-lint-diagnostic
          path: ${{ runner.temp }}/final-lint.log
          if-no-files-found: error
          retention-days: 1
      - name: Compile and check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q vulnhunter tests
          for file in vulnhunter/web/static/web/*.js; do node --check "$file"; done
          bash -n .devcontainer/start-vulnhunter.sh
      - name: Commit repaired implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete persistent workspaces and adaptive reasoning'
          git push origin HEAD:agent/persistent-workspaces-uploads
