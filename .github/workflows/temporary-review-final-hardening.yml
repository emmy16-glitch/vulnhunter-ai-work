name: Temporary remediation review final hardening

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-review-final-hardening.yml
      - scripts/patch_remediation_review_hardening.py

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'impl/independent-remediation-review' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: impl/independent-remediation-review
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: python scripts/patch_remediation_review_hardening.py
      - run: python -m ruff format vulnhunter/web/remediation_views.py vulnhunter/web/remediation_review_service.py tests/unit/test_remediation_review_signing_key.py
      - run: python -m ruff check vulnhunter/web/remediation_views.py vulnhunter/web/remediation_review_service.py tests/unit/test_remediation_review_signing_key.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vulnhunter/web/remediation_views.py vulnhunter/web/remediation_review_service.py tests/unit/test_remediation_review_signing_key.py
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Harden remediation review signing and receipt loading"
          git push origin HEAD:impl/independent-remediation-review
