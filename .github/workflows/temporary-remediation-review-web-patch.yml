name: Temporary remediation review web patch

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/temporary-remediation-review-web-patch.yml
      - scripts/patch_remediation_review_web.py

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'impl/independent-remediation-review' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: impl/independent-remediation-review
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: python scripts/patch_remediation_review_web.py
      - run: python -m ruff format vulnhunter/web/remediation_conversation_state.py vulnhunter/web/remediation_views.py vulnhunter/web/remediation_review_views.py vulnhunter/web/remediation_review_conversation_views.py vulnhunter/web/remediation_review_service.py vulnhunter/web/urls.py tests/unit/test_independent_remediation_review_web.py
      - run: python -m ruff check --fix vulnhunter/web/remediation_conversation_state.py vulnhunter/web/remediation_views.py vulnhunter/web/remediation_review_views.py vulnhunter/web/remediation_review_conversation_views.py vulnhunter/web/remediation_review_service.py vulnhunter/web/urls.py tests/unit/test_independent_remediation_review_web.py
      - run: node --check vulnhunter/web/static/web/conversation-runtime-compat.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example vulnhunter/web/remediation_conversation_state.py vulnhunter/web/remediation_views.py vulnhunter/web/static/web/conversation-runtime-compat.js vulnhunter/web/templates/web/remediation_detail.html vulnhunter/web/urls.py vulnhunter/web/remediation_review_views.py vulnhunter/web/remediation_review_conversation_views.py vulnhunter/web/remediation_review_service.py tests/unit/test_independent_remediation_review_web.py
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Wire independent remediation review workspace"
          git push origin HEAD:impl/independent-remediation-review
