name: Format persistent workspace implementation

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/persistent-workspaces-uploads
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply Ruff fixes
        run: |
          python -m pip install ruff
          python -m ruff format \
            tests/unit/test_persistent_conversation_threads.py \
            vulnhunter/web/conversation_mobile_views.py \
            vulnhunter/web/conversation_service.py \
            vulnhunter/web/conversation_thread_views.py \
            vulnhunter/web/conversational_views.py
          python -m ruff check --fix --exit-zero \
            tests/unit/test_persistent_conversation_threads.py \
            vulnhunter/web/conversation_mobile_views.py \
            vulnhunter/web/conversation_service.py \
            vulnhunter/web/conversation_thread_views.py \
            vulnhunter/web/conversational_views.py
          python -m ruff format \
            tests/unit/test_persistent_conversation_threads.py \
            vulnhunter/web/conversation_mobile_views.py \
            vulnhunter/web/conversation_service.py \
            vulnhunter/web/conversation_thread_views.py \
            vulnhunter/web/conversational_views.py
          git diff --check
      - name: Commit formatting
        run: |
          git add \
            tests/unit/test_persistent_conversation_threads.py \
            vulnhunter/web/conversation_mobile_views.py \
            vulnhunter/web/conversation_service.py \
            vulnhunter/web/conversation_thread_views.py \
            vulnhunter/web/conversational_views.py
          git config user.name "VulnHunter automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Format persistent workspace implementation"
          git push origin HEAD:agent/persistent-workspaces-uploads
