name: Chat taskgraph implementation

on:
  push:
    branches:
      - impl/chat-taskgraph-slice

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[chat-taskgraph-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          package = root / 'vulnhunter' / 'assessment_graph'
          package.mkdir(parents=True, exist_ok=True)

