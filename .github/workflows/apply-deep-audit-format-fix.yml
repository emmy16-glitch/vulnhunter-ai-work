name: Apply deep-audit formatting

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/deep-independent-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out deep-audit branch
        uses: actions/checkout@v6
        with:
          ref: agent/deep-independent-audit
          fetch-depth: 0

      - name: Apply canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/deep-audit-format-fix.patch
          git apply .github/deep-audit-format-fix.patch
          rm .github/deep-audit-format-fix.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply canonical formatting to deep audit"
          git push origin HEAD:agent/deep-independent-audit
