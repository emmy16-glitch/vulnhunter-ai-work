name: Deep final source snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'agent/deep-independent-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Upload exact branch source
        uses: actions/upload-artifact@v6
        with:
          name: vulnhunter-deep-final-source
          path: |
            .
            !.git
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
