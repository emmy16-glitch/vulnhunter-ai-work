name: Apply remaining persistent workspace patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/persistent-workspaces-uploads
          fetch-depth: 0
      - name: Apply exact remaining patch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          cat .agent-remaining.part00 .agent-remaining.part01 \
            | base64 -d > "$RUNNER_TEMP/remaining.xz"
          echo "fa7d0f15c8fb402f2dc8fb6ee8261697ed0cc21f3c0ff4b8a27cf7a6c5735839  $RUNNER_TEMP/remaining.xz" \
            | sha256sum -c -
          xz -dc "$RUNNER_TEMP/remaining.xz" > "$RUNNER_TEMP/remaining.diff"
          if ! git apply --3way --index --binary "$RUNNER_TEMP/remaining.diff"; then
            {
              echo "=== git status ==="
              git status --short
              echo "=== patch targets ==="
              grep '^diff --git ' "$RUNNER_TEMP/remaining.diff" || true
              echo "=== verbose check ==="
              git apply --check --verbose "$RUNNER_TEMP/remaining.diff" || true
            } | tee "$RUNNER_TEMP/apply-diagnostic.txt"
            exit 1
          fi
          rm -f \
            .agent-remaining.part00 \
            .agent-remaining.part01 \
            .github/workflows/agent-apply-remaining.yml
          git add -A
          git diff --cached --check
          git config user.name "VulnHunter automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Complete persistent workspace and upload integration"
          git push origin HEAD:agent/persistent-workspaces-uploads
      - name: Upload application diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: remaining-patch-diagnostic
          path: ${{ runner.temp }}/apply-diagnostic.txt
          if-no-files-found: warn
          retention-days: 1
