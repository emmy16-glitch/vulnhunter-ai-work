name: Apply remaining persistent workspace files

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/persistent-workspaces-uploads
          fetch-depth: 0
      - name: Extract exact validated files
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .agent-remaining.part00a \
            .agent-remaining.part00b \
            .agent-remaining.part01 \
            .agent-remaining.part02 \
            .agent-remaining.part03 \
            .agent-remaining.part04 \
            | base64 -d > "$RUNNER_TEMP/remaining-files.tar.gz"
          echo "320db09a727fb28aeb888a71b4421ad6f61128e8be82f5368ab9f4ea83ece4af  $RUNNER_TEMP/remaining-files.tar.gz" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/remaining-files.tar.gz" -C .
          rm -f \
            .agent-remaining.part00 \
            .agent-remaining.part00a \
            .agent-remaining.part00b \
            .agent-remaining.part01 \
            .agent-remaining.part02 \
            .agent-remaining.part03 \
            .agent-remaining.part04 \
            .github/workflows/agent-apply-remaining.yml
          python -m compileall -q \
            vulnhunter/web/conversation_service.py \
            vulnhunter/web/conversational_views.py
          node --check vulnhunter/web/static/web/conversation.js
          git add -A
          git diff --cached --check
          git config user.name "VulnHunter automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Complete persistent workspace and upload integration"
          git push origin HEAD:agent/persistent-workspaces-uploads
