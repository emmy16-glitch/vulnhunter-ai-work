name: Apply remaining product files

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/persistent-workspaces-uploads
          fetch-depth: 0
      - name: Rebuild archive
        run: |
          cat .agent-remaining.part00a .agent-remaining.part00b .agent-remaining.part01 .agent-remaining.part02 .agent-remaining.part03 .agent-remaining.part04 | base64 -d > "$RUNNER_TEMP/files.tar.gz"
          echo "76367ffec94731c306b57416759c9de600a6385c6330c392b3471c979960b545  $RUNNER_TEMP/files.tar.gz" | sha256sum -c -
      - name: Extract and validate product files
        run: |
          tar -xzf "$RUNNER_TEMP/files.tar.gz" -C .
          git checkout -- .github/workflows/quality.yml .github/workflows/conversation-quality.yml
          python -m compileall -q vulnhunter/web/conversation_service.py vulnhunter/web/conversational_views.py
          node --check vulnhunter/web/static/web/conversation.js
          git diff --check
      - name: Publish product files
        run: |
          rm -f .agent-remaining.part00 .agent-remaining.part00a .agent-remaining.part00b .agent-remaining.part01 .agent-remaining.part02 .agent-remaining.part03 .agent-remaining.part04
          git add -A
          git diff --cached --check
          git config user.name "VulnHunter automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Complete persistent workspace and upload integration"
          git push origin HEAD:agent/persistent-workspaces-uploads
